<!DOCTYPE html>
<html lang="vi">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f131c">
  <meta name="description" content="AurumSentinel MVP: mô phỏng tích sản vàng, so sánh thị trường, kịch bản và quản lý két vàng cá nhân.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="AurumSentinel">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="manifest" href="manifest.json">
  <title>AurumSentinel · Gold Wealth MVP</title>
  <style>
    html, body { margin: 0; min-height: 100%; background: #0f131c; color: #f3ead4; font-family: system-ui, sans-serif; }
    #startup { position: fixed; inset: 0; display: grid; place-content: center; text-align: center; padding: 24px; }
    #startup img { margin: 0 auto 16px; }
    #startup p { color: #a5aab5; font-size: 14px; line-height: 1.6; max-width: 420px; }
    #startup button { padding: 10px 18px; color: #141002; background: #d4af37; border: 0; border-radius: 8px; cursor: pointer; }
    #startup a { color: #f4d578; }
  </style>
</head>
<body>
  <div id="startup" role="status" aria-live="polite">
    <img src="favicon.svg" width="56" height="56" alt="">
    <strong>AurumSentinel</strong>
    <p id="startup-message">Đang khởi động ứng dụng quản lý tích sản vàng…</p>
  </div>
  <noscript>Vui lòng bật JavaScript để sử dụng AurumSentinel.</noscript>
  <script>
    window.showStartupError = function (message) {
      if (!document.getElementById('startup')) return;
      document.getElementById('startup-message').textContent = message || 'Không thể khởi động. Kiểm tra kết nối rồi tải lại trang.';
      if (!document.getElementById('startup-retry')) {
        const retry = document.createElement('button');
        retry.id = 'startup-retry';
        retry.textContent = 'Tải lại';
        retry.onclick = function () { location.reload(); };
        document.getElementById('startup').appendChild(retry);
      }
    };

    const isSourceTemplate = document.querySelector('base').getAttribute('href').includes('$FLUTTER' + '_BASE_HREF');
    if (location.protocol === 'file:' || isSourceTemplate) {
      document.getElementById('startup-message').textContent = 'Để mở ứng dụng trên máy, hãy nhấp đúp file Mo-AurumSentinel.cmd trong thư mục cloudflare_mvp. Giữ cửa sổ chạy app mở khi sử dụng.';
      const link = document.createElement('a');
      link.href = 'http://127.0.0.1:8787/';
      link.textContent = 'Mở ứng dụng tại http://127.0.0.1:8787/';
      document.getElementById('startup').appendChild(link);
    } else {
      const bootstrap = document.createElement('script');
      bootstrap.src = 'flutter_bootstrap.js';
      bootstrap.async = true;
      bootstrap.onerror = function () { window.showStartupError(); };
      document.body.appendChild(bootstrap);
      setTimeout(function () {
        window.showStartupError('Khởi động quá lâu. Kiểm tra kết nối rồi tải lại trang.');
      }, 45000);
    }
  </script>
</body>
</html>
